<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Puntofibra</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Puntofibra">

<style>
  :root{ --bg:#0f172a; --fg:#e2e8f0; --accent:#38bdf8; --line:#e2e8f0; --muted:#64748b; --text:#0f172a; --blue:#2563eb; --gold:#f5c344; --bad:#dc2626; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; width:100%; background:var(--bg); overscroll-behavior:none;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  body.enApp{ overflow:hidden; }
  .hidden{ display:none !important; }

  #app{ position:fixed; inset:0; width:100%; height:100%; height:100dvh; border:0; display:block; background:#fff; }

  /* Pantalla de carga */
  #splash{ position:fixed; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
    background:var(--bg); color:var(--fg); transition:opacity .35s ease; padding:24px; text-align:center; }
  #splash.hide{ opacity:0; pointer-events:none; }
  #splash img{ width:120px; height:auto; border-radius:14px; }
  .spin{ width:34px; height:34px; border-radius:50%; border:3px solid rgba(226,232,240,.22); border-top-color:var(--accent); animation:spin .9s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #fallback{ display:none; max-width:420px; }
  #fallback p{ font-size:15px; line-height:1.5; color:#94a3b8; margin:0 0 18px; }
  #fallback a{ display:inline-block; background:var(--accent); color:#05202e; font-weight:700; text-decoration:none; padding:12px 22px; border-radius:10px; font-size:15px; }

  /* Login */
  #login{ min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px 16px;
    background:radial-gradient(1200px 600px at 50% 0%, #eef2ff 0%, #f4f6fb 55%); }
  .card{ width:min(460px,100%); border:1px solid var(--line); background:linear-gradient(180deg,#fff 0%,#f8fafc 100%); border-radius:22px; padding:26px;
    box-shadow:0 30px 60px -12px rgba(15,23,42,.25), 0 12px 24px -8px rgba(15,23,42,.15); }
  .top{ display:flex; justify-content:center; padding-bottom:14px; border-bottom:1px solid var(--line); margin-bottom:10px; min-height:60px; }
  .top img{ max-width:220px; max-height:110px; height:auto; display:block; }
  .sub{ text-align:center; color:var(--muted); font-size:12px; letter-spacing:.2px; margin-bottom:6px; }
  label{ display:block; color:var(--muted); font-size:12px; margin-top:12px; font-weight:600; }
  input{ width:100%; margin-top:6px; padding:13px 12px; border-radius:12px; border:1px solid #cbd5e1; background:#fff; color:var(--text); font:inherit; font-size:16px; outline:none; }
  input:focus{ border-color:rgba(37,99,235,.55); box-shadow:0 0 0 3px rgba(37,99,235,.12); }
  .pw{ position:relative; }
  .pw input{ padding-right:48px; }
  .pw button{ position:absolute; right:6px; top:50%; transform:translateY(-35%); border:0; background:none; font-size:18px; cursor:pointer; padding:6px; }

  .entrar{ position:relative; overflow:hidden; width:100%; margin-top:18px; height:50px; border-radius:12px; cursor:pointer;
    border:1px solid rgba(37,99,235,.45); background:var(--blue); color:#fff; font:inherit; font-weight:800; font-size:16px; letter-spacing:.04em;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  .entrar .fill{ position:absolute; left:0; top:0; bottom:0; width:0; background:linear-gradient(90deg,#f5c344,#ffdf7a); pointer-events:none; }
  .entrar .fill::after{ content:""; position:absolute; right:0; top:0; bottom:0; width:24px; background:linear-gradient(90deg,transparent,rgba(255,255,255,.7)); }
  .entrar .txt{ position:relative; }
  .entrar.holding{ border-color:var(--gold); color:#3b2a00; background:#1e3a8a; }
  .entrar.holding .txt{ color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.45); }
  .entrar.done{ animation:pulse .3s ease 2; }
  .entrar:disabled{ opacity:.6; cursor:default; }
  @keyframes pulse{ 50%{ transform:scale(1.03); } }

  .hint{ text-align:center; color:var(--muted); font-size:12px; margin-top:12px; min-height:16px; }
  .hint.err{ color:var(--bad); font-weight:700; }
  .tip{ text-align:center; color:#94a3b8; font-size:11.5px; margin-top:6px; }
  .acc{ display:flex; gap:8px; margin-top:18px; padding-top:14px; border-top:1px solid var(--line); }
  .acc button{ flex:1; padding:10px; border-radius:10px; border:1px solid #cbd5e1; background:#fff; color:#334155; font:inherit; font-size:13px; font-weight:600; cursor:pointer; }

  /* Modales */
  .velo{ position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; padding:16px; }
  .velo.on{ display:flex; }
  .llave{ background:#101a2b; border:1px solid var(--gold); border-radius:14px; max-width:330px; width:100%; padding:24px 20px; text-align:center; color:#eee; }
  .llave h3{ color:var(--gold); font-size:15px; letter-spacing:.05em; text-transform:uppercase; margin:6px 0 10px; }
  .llave p{ color:#aab3c2; font-size:13.5px; line-height:1.45; margin:0 0 14px; }
  .nfcIco{ font-size:2.2rem; display:inline-block; }
  .nfcIco.busca{ animation:nfcPulso 1.2s ease-in-out infinite; }
  .nfcIco.err{ animation:nfcTiembla .35s ease 2; }
  .nfcIco.ok{ transform:scale(1.15); }
  @keyframes nfcPulso{ 50%{ transform:scale(1.18); filter:drop-shadow(0 0 10px #f5c344); } }
  @keyframes nfcTiembla{ 25%{ transform:translateX(-6px); } 75%{ transform:translateX(6px); } }
  #llTxt.err{ color:#ff8a8a; }
  #llTxt.ok{ color:#7dffa8; }
  .qr{ background:#fff; border-radius:8px; padding:10px; display:inline-block; margin-bottom:12px; }
  .qr img{ width:200px; height:200px; display:block; }
  #llCod{ color:var(--gold); font-weight:700; letter-spacing:.25em; margin-bottom:16px; }
  .b1{ width:100%; background:#2f6fed; color:#fff; border:0; border-radius:8px; padding:12px; font:inherit; font-weight:600; margin-bottom:10px; cursor:pointer; }
  .b2{ width:100%; background:transparent; color:#aab3c2; border:1px solid #333f52; border-radius:8px; padding:10px; font:inherit; cursor:pointer; }
  .box{ background:#fff; border-radius:14px; max-width:360px; width:100%; padding:22px; color:var(--text); font-size:14px; line-height:1.5; }
  .box h3{ margin:0 0 10px; }
  .box .b2{ color:#334155; border-color:#cbd5e1; margin-top:12px; }
  .share{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .share a, .share button{ display:block; text-align:center; padding:11px; border-radius:10px; border:1px solid #cbd5e1; background:#f8fafc; color:#0f172a; text-decoration:none; font:inherit; font-weight:600; cursor:pointer; }
</style>
</head>
<body>

<!-- ===== LOGIN (aquí lo guarda y lo rellena Google Contraseñas) ===== -->
<div id="login" class="hidden">
  <div class="card">
    <div class="top"><img id="logo" alt="Puntofibra" src="https://i.postimg.cc/vZwLhn6g/descarga.png"></div>
    <div class="sub">GESTIÓN DE CONTRATOS DE TELECOMUNICACIONES</div>

    <form id="fLogin" method="post" action="#" autocomplete="on" novalidate>
      <!-- Oculto: solo para que Google Contraseñas guarde la clave con el nombre "Puntofibra" -->
      <input id="usuario" name="username" type="text" value="Puntofibra" autocomplete="username" tabindex="-1" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0;">
      <label for="password">Contraseña</label>
      <div class="pw">
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="button" id="ojo" aria-label="Ver contraseña">👁</button>
      </div>
      <button class="entrar" id="entrar" type="submit"><span class="fill" id="fill"></span><span class="txt" id="entrarTxt">ENTRAR</span></button>
    </form>
    <div class="hint" id="hint"></div>

  </div>
</div>

<!-- ===== LLAVE NFC ===== -->
<div class="velo" id="veloLlave">
  <div class="llave">
    <div class="nfcIco" id="llIco">🔑</div>
    <h3 id="llTit">Acceso con llave</h3>
    <p id="llTxt">Acerca tu llave NFC a la parte trasera del móvil</p>
    <div id="llQrBox" class="hidden">
      <div class="qr"><img id="llQr" alt="Código QR"></div>
      <div id="llCod">······</div>
      <button class="b1" id="llAbrir">📱 Estoy en este móvil, abrir lector</button>
    </div>
    <button class="b1 hidden" id="llScan">📡 Escanear llave</button>
    <button class="b2" id="llCerrar">Cancelar</button>
  </div>
</div>

<!-- ===== APP (Apps Script) ===== -->
<iframe id="app" class="hidden" title="Puntofibra" allow="clipboard-read; clipboard-write; camera; geolocation"></iframe>

<div id="splash">
  <img src="https://i.postimg.cc/vZwLhn6g/descarga.png" alt="Puntofibra" onerror="this.style.display='none'">
  <div class="spin" id="spin"></div>
  <div id="fallback">
    <p>No se ha podido cargar el panel aquí dentro.<br>Suele pasar cuando Google pide iniciar sesión, porque esa pantalla no se deja incrustar.</p>
    <a id="direct" href="#" target="_blank" rel="noopener">Abrir directamente</a>
  </div>
</div>

<script>
  // ==== ÚNICA LÍNEA QUE HAY QUE TOCAR SI CAMBIAS DE IMPLEMENTACIÓN ====
  const EXEC_URL = "https://script.google.com/macros/s/AKfycbzecmwGqhsXIxDzgHx27iwrtgrFfHMizRH4iKYWX_EiGaUxLM066soojtD70Bi9b9jZ/exec";
  // ====================================================================

  const LS_TOKEN = 'pf_sesion';
  const $ = id => document.getElementById(id);
  const frame = $('app'), splash = $('splash');
  let splashTimer = null;
  $('direct').href = EXEC_URL;

  function lsGet(k){ try{ return localStorage.getItem(k) || ''; }catch(e){ return ''; } }
  function lsSet(k,v){ try{ v ? localStorage.setItem(k,v) : localStorage.removeItem(k); }catch(e){} }

  // ---------- API (POST al Apps Script) ----------
  async function api(datos){
    const r = await fetch(EXEC_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body:JSON.stringify(datos), redirect:'follow' });
    if(!r.ok) throw new Error('El servidor no responde (' + r.status + ')');
    return r.json();
  }

  // ---------- Pantallas ----------
  function mostrarSplash(){
    splash.classList.remove('hide'); splash.style.display = '';
    $('spin').style.display = ''; $('fallback').style.display = 'none';
  }
  function ocultarSplash(){
    clearTimeout(splashTimer);
    splash.classList.add('hide');
    setTimeout(() => { if(splash.classList.contains('hide')) splash.style.display = 'none'; }, 400);
  }
  function mostrarLogin(msg){
    document.body.classList.remove('enApp');
    frame.classList.add('hidden'); frame.removeAttribute('src');
    $('login').classList.remove('hidden');
    ocultarSplash();
    hint(msg || '', !!msg);
    setTimeout(() => { $('password').focus(); }, 60);
  }
  function abrirApp(token){
    lsSet(LS_TOKEN, token);
    $('login').classList.add('hidden');
    document.body.classList.add('enApp');
    mostrarSplash();
    frame.classList.remove('hidden');
    frame.src = EXEC_URL + '?w=1&s=' + encodeURIComponent(token);
    // Si en 25 s no ha avisado de que ha entrado, enseñamos el enlace directo
    splashTimer = setTimeout(() => { $('spin').style.display = 'none'; $('fallback').style.display = 'block'; }, 25000);
  }
  function hint(t, err){ const h = $('hint'); h.textContent = t; h.classList.toggle('err', !!err); }

  // Mensajes que manda el panel desde dentro del iframe
  window.addEventListener('message', ev => {
    const d = ev.data || {};
    if(d.pf === 'ready') ocultarSplash();
    if(d.pf === 'nfc' && /(\.googleusercontent\.com|^https:\/\/script\.google\.com)$/.test(ev.origin)) llavePedidaPorPanel(ev, d);
    if(d.pf === 'nfcCerrar' && llOrigen) { llOrigen = null; cerrarLlave(); }
    if(d.pf === 'logout'){
      lsSet(LS_TOKEN, '');
      try{ if(navigator.credentials && navigator.credentials.preventSilentAccess) navigator.credentials.preventSilentAccess(); }catch(e){}
      mostrarLogin(d.msg || '');
    }
  });

  // ---------- Login solo con contraseña (o código de Authenticator) ----------
  $('fLogin').addEventListener('submit', async ev => {
    ev.preventDefault();
    const usuario = 'Puntofibra', password = $('password').value.trim();
    if(!password){ hint('Escribe tu contraseña', true); $('password').focus(); return; }
    const b = $('entrar'); b.disabled = true; hint('Comprobando…');
    try{
      const r = await api({ accion:'login', password });
      if(!r || !r.ok){ hint((r && r.error) || 'Contraseña incorrecta', true); $('password').select(); return; }
      // Pide a Google Contraseñas que la guarde (no si es un código de Authenticator)
      try{
        if(window.PasswordCredential && navigator.credentials && !/^\d{6}$/.test(password)){
          await navigator.credentials.store(new PasswordCredential({ id:usuario, password, name:'Puntofibra' }));
        }
      }catch(e){}
      $('password').value = '';
      hint('');
      abrirApp(r.token);
    }catch(e){
      hint('No se pudo conectar: ' + (e.message || e), true);
    }finally{ b.disabled = false; }
  });

  $('ojo').addEventListener('click', () => { const p = $('password'); p.type = p.type === 'password' ? 'text' : 'password'; p.focus(); });

  // ---------- Mantener pulsado ENTRAR 3 s -> llave NFC ----------
  (function(){
    const b = $('entrar'), fill = $('fill'), txt = $('entrarTxt');
    const HOLD = 3000, ARRANQUE = 250;
    let t0 = 0, raf = 0, disparado = false;
    function reset(){ cancelAnimationFrame(raf); raf = 0; b.classList.remove('holding'); fill.style.width = '0'; txt.textContent = 'ENTRAR'; }
    function paso(){
      const t = Date.now() - t0;
      if(t > ARRANQUE){
        b.classList.add('holding'); txt.textContent = '🔑 LLAVE NFC…';
        fill.style.width = Math.min(100, (t - ARRANQUE) / (HOLD - ARRANQUE) * 100) + '%';
      }
      if(t >= HOLD){
        disparado = true; reset();
        try{ navigator.vibrate && navigator.vibrate(60); }catch(e){}
        b.classList.add('done'); setTimeout(() => b.classList.remove('done'), 700);
        abrirLlave();
        return;
      }
      raf = requestAnimationFrame(paso);
    }
    b.addEventListener('pointerdown', e => { if(e.button > 0 || b.disabled) return; disparado = false; t0 = Date.now(); cancelAnimationFrame(raf); raf = requestAnimationFrame(paso); });
    ['pointerup','pointerleave','pointercancel'].forEach(n => b.addEventListener(n, () => { if(raf) reset(); }));
    // Si se ha abierto la llave, el clic de soltar no envía el formulario
    b.addEventListener('click', e => { if(disparado){ e.preventDefault(); e.stopImmediatePropagation(); disparado = false; } }, true);
    b.addEventListener('contextmenu', e => e.preventDefault());
  })();

  // ---------- Llave NFC directa (sin Central de Llaves) ----------
  // Android con NFC: se lee la llave aquí mismo. Ordenador / iPhone: QR para pasarla con el móvil.
  const hayNfc = 'NDEFReader' in window;
  let nfcCtrl = null, nfcUso = null;          // nfcUso: función que recibe el número de serie leído
  let llTimer = null, llCodigo = null, llUrl = '', llVentana = null, llSondeando = false, llOrigen = null, llOcupado = false;
  function llIco(c){ $('llIco').className = 'nfcIco ' + (c || ''); }
  function llMsg(t, c){ const e = $('llTxt'); e.textContent = t; e.className = c || ''; }
  function vib(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }
  function pararNfc(){ if(nfcCtrl){ try{ nfcCtrl.abort(); }catch(e){} nfcCtrl = null; } }
  // El lector se queda encendido mientras la ventana está abierta (así Android no abre la web grabada en la llave)
  async function escanearNfc(auto){
    if(!hayNfc) return false;
    try{
      if(!nfcCtrl){
        nfcCtrl = new AbortController();
        const r = new NDEFReader();
        await r.scan({ signal:nfcCtrl.signal });
        r.onreadingerror = () => { if(llOcupado) return; llIco('err'); llMsg('No he podido leer esa llave, vuelve a acercarla', 'err'); };
        r.onreading = ev => { if(llOcupado || !nfcUso) return; const sn = String(ev.serialNumber || ''); if(!sn){ llIco('err'); return llMsg('La llave no tiene número de serie legible', 'err'); } nfcUso(sn); };
      }
      $('llScan').classList.add('hidden');
      llIco('busca'); llMsg('Acerca tu llave NFC a la parte trasera del móvil');
      return true;
    }catch(err){
      pararNfc(); llIco('');
      if(err && err.name === 'NotAllowedError' && auto){ $('llScan').classList.remove('hidden'); llMsg('Pulsa «Escanear llave» y acerca tu llave'); return true; }
      if(err && err.name === 'NotAllowedError'){ llIco('err'); llMsg('Necesito permiso para usar el NFC. Acéptalo y vuelve a pulsar.', 'err'); $('llScan').classList.remove('hidden'); return true; }
      return false; // sin NFC de verdad (apagado o no tiene): se usa el QR
    }
  }
  $('llScan').addEventListener('click', () => escanearNfc(false));
  function abrirVelo(titulo){
    $('llTit').textContent = titulo || 'Acceso con llave';
    $('llQrBox').classList.add('hidden'); $('llScan').classList.add('hidden');
    llIco(''); llMsg('Un momento…'); llOcupado = false;
    $('veloLlave').classList.add('on');
  }
  function cerrarLlave(avisar){
    pararNfc(); nfcUso = null; llOcupado = false;
    clearInterval(llTimer); llTimer = null; llCodigo = null; llUrl = '';
    try{ if(llVentana && !llVentana.closed) llVentana.close(); }catch(e){}
    llVentana = null;
    if(avisar && llOrigen){ try{ llOrigen.postMessage({ pf:'nfcCancel' }, '*'); }catch(e){} }
    llOrigen = null;
    $('veloLlave').classList.remove('on');
  }
  $('llCerrar').addEventListener('click', () => cerrarLlave(true));
  $('llAbrir').addEventListener('click', () => { if(!llUrl) return; try{ if(llVentana && !llVentana.closed) llVentana.close(); }catch(e){} llVentana = window.open(llUrl, 'lectorLlave'); });

  // ---- Entrar con la llave ----
  async function abrirLlave(){
    if($('veloLlave').classList.contains('on')) return;
    abrirVelo('Acceso con llave');
    nfcUso = async sn => {
      llOcupado = true; llIco('busca'); llMsg('Comprobando llave…');
      try{
        const r = await api({ accion:'nfcLogin', llave:sn });
        if(r && r.ok && r.token){ llIco('ok'); llMsg('¡Acceso concedido!', 'ok'); vib(60); setTimeout(() => { cerrarLlave(); abrirApp(r.token); }, 450); return; }
        llIco('err'); vib([80,60,80]); llMsg((r && r.error) || 'Llave no autorizada', 'err');
      }catch(e){ llIco('err'); llMsg('No se pudo conectar: ' + (e.message || e), 'err'); }
      llOcupado = false;
    };
    if(await escanearNfc(true)) return;
    nfcUso = null;
    llaveQr({ accion:'nfcCrear', tipo:'login' });
  }
  // QR para pasar la llave con otro móvil (ordenador / iPhone)
  async function llaveQr(datos){
    llMsg('Escanea el QR con un móvil Android con NFC y acerca tu llave');
    $('llCod').textContent = '······'; $('llQr').removeAttribute('src'); $('llQrBox').classList.remove('hidden');
    try{
      const r = await api(datos);
      if(!r || !r.ok) throw new Error((r && r.error) || 'No se pudo preparar el código');
      llCodigo = r.codigo; llUrl = r.url;
      $('llCod').textContent = r.codigo;
      $('llQr').src = 'https://api.qrserver.com/v1/create-qr-code/?size=320x320&margin=0&data=' + encodeURIComponent(r.url);
      clearInterval(llTimer); llTimer = setInterval(sondearLlave, 1500);
    }catch(e){ cerrarLlave(); hint('Llave: ' + (e.message || e), true); }
  }
  async function sondearLlave(){
    if(!llCodigo || llSondeando) return;
    llSondeando = true;
    const cod = llCodigo;
    try{
      const r = await api({ accion:'nfcEstado', codigo:cod });
      if(!r || cod !== llCodigo) return;
      if(r.estado === 'ok' && r.token){ cerrarLlave(); abrirApp(r.token); return; }
      if(r.estado === 'denegado' || r.estado === 'caducado'){ cerrarLlave(); hint(r.motivo || 'La llave no es válida', true); }
    }catch(e){}
    finally{ llSondeando = false; }
  }

  // ---- El panel (dentro del iframe) pide la llave para Ajustes o para añadir una llave ----
  // En el ordenador el propio panel enseña el QR; aquí solo actuamos si este móvil tiene NFC.
  async function llavePedidaPorPanel(ev, d){
    if(!hayNfc || !d.codigo) return;
    cerrarLlave();
    abrirVelo(d.titulo || 'Pasa tu llave');
    llOrigen = ev.source;
    const codigo = d.codigo;
    nfcUso = async sn => {
      llOcupado = true; llIco('busca'); llMsg('Comprobando llave…');
      try{
        const r = await api({ accion:'nfcAutorizar', codigo, llave:sn });
        if(r && r.ok){
          llIco('ok'); vib(60); llMsg(r.mensaje || 'Hecho', 'ok');
          const o = llOrigen;
          setTimeout(() => { llOrigen = null; cerrarLlave(); try{ o && o.postMessage({ pf:'nfcHecho' }, '*'); }catch(e){} }, 500);
          return;
        }
        llIco('err'); vib([80,60,80]); llMsg((r && r.error) || 'Llave no autorizada', 'err');
      }catch(e){ llIco('err'); llMsg('No se pudo conectar: ' + (e.message || e), 'err'); }
      llOcupado = false;
    };
    if(!(await escanearNfc(true))){ llOrigen = null; cerrarLlave(); } // sin NFC: el panel ya enseña su QR
  }

  // ---------- Arranque ----------
  (function(){
    const t = lsGet(LS_TOKEN);
    if(t) abrirApp(t); else mostrarLogin();
    api({ accion:'config' }).then(r => { if(r && r.logoUrl) $('logo').src = r.logoUrl; }).catch(() => {});
  })();

  // Service worker: necesario para que se pueda instalar como app
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
