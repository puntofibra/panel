<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Lucas avanzado · prueba</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1210;color:#e8fff1;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column;height:100dvh}
header{padding:12px 16px;border-bottom:1px solid rgba(46,230,120,.25);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header b{font-size:16px;letter-spacing:.5px}
#modo{font-size:11px;font-weight:800;letter-spacing:1px;padding:3px 9px;border-radius:99px;background:#26302c;color:#9fb5aa}
#modo.on{background:#17c964;color:#04130b}
#est{flex:1;min-width:180px;font-size:12px;color:#9fd8b8}
#barra{height:4px;background:rgba(255,255,255,.1);border-radius:9px;overflow:hidden;width:100%}
#barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,#17c964,#5dfc9d);transition:width .3s}
#info{padding:6px 16px;font-size:11px;color:#7f968b;border-bottom:1px solid rgba(255,255,255,.06);white-space:pre-wrap}
#chat{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:9px}
.m{max-width:86%;padding:9px 12px;border-radius:13px;white-space:pre-wrap;word-break:break-word}
.u{align-self:flex-end;background:#17c964;color:#04130b}
.a{align-self:flex-start;background:#18221e;border:1px solid rgba(46,230,120,.18)}
.s{align-self:center;font-size:11px;color:#7f968b}
form{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid rgba(46,230,120,.25)}
input{flex:1;padding:11px 13px;border-radius:11px;border:1px solid #2b3a33;background:#111a16;color:#e8fff1;font-size:16px;min-width:0}
button{padding:10px 14px;border-radius:11px;border:1px solid #2b3a33;background:#17c964;color:#04130b;font-weight:800;font-size:14px;cursor:pointer}
button.g{background:#18221e;color:#c8e6d6;font-weight:600;font-size:12px;padding:6px 10px}
button:disabled{opacity:.4;cursor:default}
</style>
</head>
<body>
<header>
  <b>🤖 Lucas</b><span id="modo">LUCAS BÁSICO</span>
  <div id="est">Comprobando este dispositivo…<div id="barra"><i></i></div></div>
  <button class="g" id="bApagar" disabled>Apagar</button>
  <button class="g" id="bBorrar">Borrar descarga</button>
</header>
<div id="info"></div>
<div id="chat"><div class="m s">Página de prueba de Lucas avanzado. La inteligencia se descarga sola la primera vez y queda guardada en este navegador. Aquí no hay datos de clientes.</div></div>
<form id="f"><input id="q" placeholder="Escribe aquí cuando Lucas avanzado esté listo…" autocomplete="off" disabled><button id="bEnviar" disabled>Enviar</button></form>
<script type="module">
const $ = id => document.getElementById(id);
const est = (t, p) => { $('est').firstChild.nodeValue = t; if (p != null) $('barra').firstElementChild.style.width = Math.max(0, Math.min(100, p)) + '%'; };
const say = (t, c) => { const d = document.createElement('div'); d.className = 'm ' + c; d.textContent = t; $('chat').appendChild(d); $('chat').scrollTop = 1e9; return d; };
const SISTEMA = 'Eres Lucas, un asistente amable y directo. Respondes siempre en español de España, con frases claras y sin rodeos. Si no sabes algo, lo dices. No tienes acceso a contratos ni a datos de clientes.';
let webllm = null, engine = null, MODELO = '', ocupado = false, hist = [], ES_MOVIL = false;
const info = [];
function basico(motivo){ $('modo').className = ''; $('modo').textContent = 'LUCAS BÁSICO'; est(motivo, 0); $('q').disabled = true; $('bEnviar').disabled = true; $('bApagar').disabled = true; }
async function comprobar(){
  info.push('Navegador: ' + navigator.userAgent.replace(/^Mozilla\/5\.0 /, '').slice(0, 110));
  if (navigator.deviceMemory) info.push('Memoria que declara el navegador: ' + navigator.deviceMemory + ' GB');
  const movil = (navigator.userAgentData && navigator.userAgentData.mobile) || /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
  if (movil){ info.push('Móvil o tableta: aquí Lucas avanzado no se descarga'); ES_MOVIL = true; return null; }
  if (!navigator.gpu){ info.push('WebGPU: NO disponible'); return null; }
  let ad = null; try{ ad = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' }); }catch(e){}
  if (!ad){ info.push('WebGPU: sin adaptador gráfico'); return null; }
  const f16 = ad.features.has('shader-f16');
  info.push('WebGPU: sí · shader-f16: ' + (f16 ? 'sí' : 'no') + ' · búfer máx: ' + Math.round(ad.limits.maxBufferSize / 1048576) + ' MB');
  try{ if (navigator.storage && navigator.storage.estimate){ const e = await navigator.storage.estimate(); info.push('Espacio libre para guardar: ' + Math.round((e.quota - e.usage) / 1048576) + ' MB'); } }catch(e){}
  return 'Qwen2.5-1.5B-Instruct-' + (f16 ? 'q4f16_1' : 'q4f32_1') + '-MLC';
}
async function arrancar(){
  MODELO = await comprobar(); $('info').textContent = info.join('\n');
  if (!MODELO) return basico(ES_MOVIL ? 'En el móvil Lucas funciona como siempre: la inteligencia avanzada solo se descarga en ordenadores.' : 'Este ordenador no es compatible con Lucas avanzado. Sigue funcionando Lucas básico.');
  try{ webllm = await import('https://esm.run/@mlc-ai/web-llm'); }
  catch(e){ return basico('No se ha podido cargar el motor (' + (e.message || e) + ').'); }
  let enCache = false; try{ enCache = await webllm.hasModelInCache(MODELO); }catch(e){}
  info.push('Modelo: ' + MODELO + (enCache ? ' (ya descargado en este navegador)' : ' (primera descarga)')); $('info').textContent = info.join('\n');
  const t0 = performance.now();
  const prog = r => { const p = Math.round((r.progress || 0) * 100); est((enCache ? 'Cargando Lucas avanzado… ' : 'Descargando Lucas avanzado en segundo plano… ') + p + '%', p); };
  const guardia = setTimeout(() => { if (!engine) est('Está tardando más de lo normal. Puedes seguir esperando o cerrar la página.', null); }, 15 * 60000);
  try{
    try{ engine = await webllm.CreateWebWorkerMLCEngine(new Worker(new URL('./lucas-ia-worker.js', import.meta.url), { type: 'module' }), MODELO, { initProgressCallback: prog }); info.push('Motor: en segundo plano (Web Worker)'); }
    catch(eW){ info.push('Web Worker no disponible (' + String(eW.message || eW).slice(0, 80) + '): uso el hilo principal'); engine = await webllm.CreateMLCEngine(MODELO, { initProgressCallback: prog }); }
  }catch(e){ clearTimeout(guardia); info.push('ERROR al cargar: ' + String(e.message || e).slice(0, 200)); $('info').textContent = info.join('\n'); return basico('Lucas avanzado no ha podido arrancar en este dispositivo. Sigue funcionando Lucas básico.'); }
  clearTimeout(guardia);
  info.push('Listo en ' + Math.round((performance.now() - t0) / 1000) + ' s'); $('info').textContent = info.join('\n');
  $('modo').className = 'on'; $('modo').textContent = 'LUCAS AVANZADO'; est('Lucas avanzado listo.', 100);
  $('q').disabled = false; $('bEnviar').disabled = false; $('bApagar').disabled = false; $('q').placeholder = 'Pregúntale lo que quieras…'; $('q').focus();
}
$('f').addEventListener('submit', async ev => {
  ev.preventDefault(); const t = $('q').value.trim(); if (!t || !engine || ocupado) return;
  ocupado = true; $('bEnviar').disabled = true; $('q').value = ''; say(t, 'u'); hist.push({ role: 'user', content: t }); if (hist.length > 12) hist = hist.slice(-12);
  const b = say('…', 'a'); let out = '', n = 0; const t0 = performance.now();
  try{
    const st = await engine.chat.completions.create({ messages: [{ role: 'system', content: SISTEMA }].concat(hist), stream: true, temperature: 0.6, max_tokens: 500 });
    for await (const ch of st){ const d = ch.choices && ch.choices[0] && ch.choices[0].delta && ch.choices[0].delta.content; if (d){ out += d; n++; b.textContent = out; $('chat').scrollTop = 1e9; } }
    hist.push({ role: 'assistant', content: out });
    const s = (performance.now() - t0) / 1000; say(Math.round(n / s * 10) / 10 + ' palabras-trozo por segundo · ' + Math.round(s * 10) / 10 + ' s', 's');
  }catch(e){ b.textContent = 'No he podido responder (' + String(e.message || e).slice(0, 160) + ').'; }
  ocupado = false; $('bEnviar').disabled = !engine; $('q').focus();
});
$('bApagar').addEventListener('click', async () => { try{ if (engine) await engine.unload(); }catch(e){} engine = null; hist = []; basico('Lucas avanzado apagado y memoria liberada. Recarga la página para volver a encenderlo.'); });
$('bBorrar').addEventListener('click', async () => {
  try{ if (engine) await engine.unload(); }catch(e){} engine = null;
  try{ if (!webllm) webllm = await import('https://esm.run/@mlc-ai/web-llm'); for (const m of ['Qwen2.5-1.5B-Instruct-q4f16_1-MLC', 'Qwen2.5-1.5B-Instruct-q4f32_1-MLC']){ try{ await webllm.deleteModelAllInfoInCache(m); }catch(e){} } basico('Descarga borrada de este navegador.'); }
  catch(e){ basico('No se ha podido borrar (' + (e.message || e) + ').'); }
});
arrancar();
</script>
</body>
</html>
